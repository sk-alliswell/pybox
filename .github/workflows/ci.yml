name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --check
      - run: cargo test --locked --all-features
      - run: cargo build --locked --all-features --bins
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_guards.py --tools target/debug
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  gateway-sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/sim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Predicted against measured
        run: >
          cargo run --locked --release --bin gwsim -- validate-all scenarios/validation.toml
          --reference reference --seeds 10 --baseline reference/baseline.json
      - run: cargo build --locked --profile wasm --target wasm32-unknown-unknown --lib
