<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pybox gateway 콘솔</title>
<style>:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --border: #e2e1dc; --grid: #ebeae6;
  --text: #0b0b0b; --text2: #52514e; --muted: #8a8983;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #1a7f4b; --bad: #c0362c; --tint: #eef4fc;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #32322f; --grid: #282826;
    --text: #f0efec; --text2: #c3c2b7; --muted: #8f8e86;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good: #4cc38a; --bad: #f0786e; --tint: #1d2836;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 650; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { border: 0; background: none; color: var(--text2); padding: 6px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
nav button[aria-selected=true] { background: var(--tint); color: var(--text); font-weight: 600; }
.controls { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, input, .btn { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
.btn { cursor: pointer; }
main { padding: 16px 20px 40px; max-width: 1400px; margin: 0 auto; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(12, 1fr); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; grid-column: span 12; min-width: 0; }
.c6 { grid-column: span 6; } .c4 { grid-column: span 4; } .c8 { grid-column: span 8; }
@media (max-width: 900px) { .c6, .c4, .c8 { grid-column: span 12; } }
.card h2 { font-size: 13px; font-weight: 650; margin: 0 0 2px; }
.card .sub { color: var(--text2); font-size: 12px; margin: 0 0 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; grid-column: span 12; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .k { color: var(--text2); font-size: 12px; }
.tile .v { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .n { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--text2); font-weight: 550; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
td.num, th.num { text-align: right; }
td.wrap { white-space: normal; }
td:not(.num):not(.wrap) { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--tint); }
.scroll { overflow: auto; max-height: 420px; }
.cellbar { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--s1); vertical-align: middle; margin-right: 6px; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
svg { display: block; width: 100%; }
svg text { fill: var(--text2); font-size: 11px; }
.tip { position: fixed; pointer-events: none; background: var(--text); color: var(--surface); padding: 6px 9px; border-radius: 6px; font-size: 12px; z-index: 20; white-space: pre; display: none; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.err { background: var(--surface); border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; display: none; }
.seg { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--surface); }
.seg div { min-width: 2px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.wf-row { display: grid; grid-template-columns: 290px 1fr 80px; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
.wf-track { position: relative; height: 14px; }
.wf-bar { position: absolute; top: 2px; height: 10px; border-radius: 3px; min-width: 2px; }
.pill { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px; border: 1px solid var(--border); color: var(--text2); }
header a.link { color: var(--text2); font-size: 12.5px; text-decoration: none; border-bottom: 1px dotted var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text2); }
.field input, .field select, .field textarea { min-width: 110px; }
textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%; resize: vertical; }
.btn.primary { background: var(--s1); border-color: var(--s1); color: #fff; font-weight: 600; }
.btn.small { padding: 2px 7px; font-size: 12px; }
.btn.danger { color: var(--bad); }
.meter { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--grid); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
.meter.over > i { background: var(--bad); }
.state { display: inline-flex; align-items: center; gap: 5px; }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.state.run::before { background: var(--s1); } .state.ok::before { background: var(--good); } .state.bad::before { background: var(--bad); } .state.warn::before { background: var(--s4); }
dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); padding: 18px 20px; width: min(520px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog h3 { margin: 0 0 10px; font-size: 15px; }
dialog .row { margin-top: 10px; }
.note { color: var(--text2); font-size: 12px; margin: 6px 0 0; }
.token { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: var(--tint); padding: 8px 10px; border-radius: 6px; word-break: break-all; user-select: all; }
.inline { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <h1>pybox gateway 콘솔</h1>
  <nav id="tabs"></nav>
  <div class="controls">
    <a class="link" href="/gateway/dashboard">ROI·트레이스 대시보드</a>
    <select id="range" title="조회 기간">
      <option value="300000">최근 5분</option><option value="900000" selected>최근 15분</option><option value="3600000">최근 1시간</option>
      <option value="21600000">최근 6시간</option><option value="86400000">최근 24시간</option><option value="604800000">최근 7일</option>
    </select>
    <label style="font-size:12px;color:var(--text2)"><input type="checkbox" id="auto" checked> 자동 새로고침</label>
    <button class="btn" id="reload">새로고침</button>
  </div>
</header>
<main>
  <div class="err" id="err"></div>
  <div id="view"></div>
</main>
<div class="tip" id="tip"></div>
<script>

const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"].map((v) => `var(${v})`);

// ---- formatting
const nf = (d) => new Intl.NumberFormat("ko-KR", { maximumFractionDigits: d, minimumFractionDigits: d });

  compact: (v) => v == null ? "–" : new Intl.NumberFormat("ko-KR", { notation: "compact", maximumFractionDigits: 1 }).format(v),

  text: (v) => v == null || v === "" ? "(없음)" : String(v),
  time: (v) => { if (!v) return "–"; const d = new Date(v), p = (n) => String(n).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; },
  clock: (v, span) => { const d = new Date(v); return span > 2 * 864e5 ? `${d.getMonth() + 1}/${d.getDate()}` : span <= 9e5 ? fmt.time(v) : d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false }); },
  dur: (ms) => ms == null ? "–" : ms < 1000 ? nf(0).format(ms) + " ms" : ms < 60000 ? nf(1).format(ms / 1000) + "초" : nf(1).format(ms / 60000) + "분",

// ---- state & API
const state = {
  tab: location.hash.slice(1) || "live", run: null,
  job: { name: "", upstream: "", model: "", prompts: "API 게이트웨이가 하는 일을 두 문장으로 설명해줘.\n좋은 커밋 메시지를 쓰는 요령 세 가지.\np95와 p99 지연의 차이는?", count: 60, concurrency: 12, max_tokens: 96, project_id: "", team_id: "", weight: 1 },
  tokGroup: "agent_id",
  lat: { metric: "total_ms", dim: "model", model: "" },
  ex: { op: "p95", col: "total_ms", dim: "model", bucket: 0, fcol: "", fval: "", compare: false },
};
let token = sessionStorage.getItem("gw-admin") || "";
async function api(path, body, method) {
  for (;;) {
    const res = await fetch(path, {
      method: method || (body ? "POST" : "GET"),
      headers: { ...(body ? { "content-type": "application/json" } : {}), ...(token ? { authorization: "Bearer " + token } : {}) },
      body: body ? JSON.stringify(body) : undefined,

    if (res.status === 401) {
      const t = prompt("게이트웨이 관리자 토큰(admin_token)을 입력하세요");
      if (!t) throw new Error("관리자 토큰이 필요합니다");
      token = t.trim(); sessionStorage.setItem("gw-admin", token); continue;
    }
    const data = res.status === 204 ? {} : await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error?.message || res.statusText);

  }
}
function win() { const span = +$("#range").value, to = Date.now() + 1000; return { from: to - span, to, span }; }
// A bucket that is still filling would draw as a dip at the right edge, so bucketed queries stop at the last full one.
const qraw = (o, w = win()) => api("/gateway/obs/query", { from: w.from, to: o.bucket_ms ? Math.floor(w.to / o.bucket_ms) * o.bucket_ms : w.to, ...o });
const q = (o, w) => qraw(o, w).then((r) => r.rows);
function bucketFor(span) { for (const b of [5e3, 1e4, 3e4, 6e4, 3e5, 9e5, 36e5, 216e5, 864e5]) if (span / b <= 72) return b; return 864e5; }
const act = (fn) => async (...a) => { try { await fn(...a); refresh(); } catch (e) { showErr(e.message); } };
function showErr(m) { $("#err").textContent = m; $("#err").style.display = m ? "block" : "none"; }

// ---- components
const tipEl = $("#tip");
function tip(ev, text) { if (!text) { tipEl.style.display = "none"; return; } tipEl.textContent = text; tipEl.style.display = "block"; const x = Math.min(ev.clientX + 14, innerWidth - tipEl.offsetWidth - 8); tipEl.style.left = x + "px"; tipEl.style.top = Math.min(ev.clientY + 14, innerHeight - tipEl.offsetHeight - 8) + "px"; }
function card(cls, title, sub, ...body) { return el("section", { class: "card " + (cls || "") }, el("h2", {}, title), sub ? el("p", { class: "sub" }, sub) : null, ...body); }
function tiles(items) { return el("div", { class: "tiles" }, items.map((t) => el("div", { class: "tile" }, el("div", { class: "k" }, t.k), el("div", { class: "v " + (t.cls || "") }, t.v), t.n ? el("div", { class: "n" }, t.n) : null))); }
const grid = (...kids) => el("div", { class: "grid", style: "margin-top:12px" }, ...kids);
function table(rows, cols, opts = {}) {
  if (!rows.length) return el("div", { class: "empty" }, opts.empty || "이 기간에 데이터가 없습니다");
  const max = {};
  for (const c of cols) if (c.bar) max[c.key] = Math.max(...rows.map((r) => +r[c.key] || 0), 1e-12);
  return el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {}, cols.map((c) => el("th", { class: c.num ? "num" : "" }, c.label)))),
    el("tbody", {}, rows.map((r) => el("tr", { class: opts.onRow ? "click" : "", onclick: opts.onRow ? () => opts.onRow(r) : null },
      cols.map((c) => {
        const v = r[c.key], td = el("td", { class: (c.num ? "num " : "") + (c.cls ? c.cls(v, r) : "") + (c.wrap ? " wrap" : "") });
        if (c.node) { td.append(c.node(v, r) ?? ""); return td; }
        const text = (c.fmt || fmt.text)(v, r);
        if (c.bar) td.append(el("span", { class: "cellbar", style: `width:${Math.max(2, 60 * (+v || 0) / max[c.key])}px` }));
        if (!c.num && !c.wrap) td.title = text;
        td.append(text);
        return td;
      }))))));
}
function selectOf(options, value, onchange, attrs = {}) {
  return el("select", { ...attrs, onchange: (e) => onchange(e.target.value) }, options.map(([v, label]) => el("option", { value: v, selected: String(v) === String(value) }, label)));
}
/** Line chart: one y axis, crosshair tooltip, legend above when there are 2+ series. */
function lineChart(series, { yfmt = fmt.int, span, height = 190, marks = [], wide = false } = {}) {
  const pts = series.flatMap((s) => s.points).filter((p) => p[1] != null);
  if (!pts.length) return el("div", { class: "empty" }, "이 기간에 데이터가 없습니다");
  const W = wide ? 1300 : 640, H = height, m = { l: 56, r: 12, t: 8, b: 22 };
  const x0 = Math.min(...pts.map((p) => p[0])), x1 = Math.max(...pts.map((p) => p[0]), x0 + 1);
  const ymax = Math.max(...pts.map((p) => p[1] || 0), ...marks.map((k) => k.v)) * 1.08 || 1;
  const X = (t) => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r), Y = (v) => H - m.b - (v / ymax) * (H - m.t - m.b);
  const g = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  for (let i = 0; i <= 3; i++) { const v = ymax * i / 3, y = Y(v); g.append(svg("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: "var(--grid)" }), svg("text", { x: m.l - 6, y: y + 4, "text-anchor": "end" }, yfmt(v))); }

  for (let i = 0; i <= xt; i++) { const t = x0 + (x1 - x0) * i / xt; g.append(svg("text", { x: X(t), y: H - 6, "text-anchor": i === 0 ? "start" : i === xt ? "end" : "middle" }, fmt.clock(t, span))); }
  for (const k of marks) g.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(k.v), y2: Y(k.v), stroke: "var(--muted)", "stroke-dasharray": "5 4" }), svg("text", { x: W - m.r, y: Y(k.v) - 4, "text-anchor": "end" }, k.label));

    g.append(svg("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-dasharray": s.dash || null, opacity: s.dash ? 0.7 : 1 }));
    if (s.points.length === 1) g.append(svg("circle", { cx: X(s.points[0][0]), cy: Y(s.points[0][1] || 0), r: 4, fill: color }));
  });
  const hair = svg("line", { y1: m.t, y2: H - m.b, stroke: "var(--muted)", "stroke-dasharray": "3 3", visibility: "hidden" });
  g.append(hair);
  const times = [...new Set(pts.map((p) => p[0]))].sort((a, b) => a - b);
  g.addEventListener("mousemove", (ev) => {
    const r = g.getBoundingClientRect(), t = x0 + ((ev.clientX - r.left) / r.width * W - m.l) / (W - m.l - m.r) * (x1 - x0);
    const near = times.reduce((a, b) => Math.abs(b - t) < Math.abs(a - t) ? b : a);
    hair.setAttribute("x1", X(near)); hair.setAttribute("x2", X(near)); hair.setAttribute("visibility", "visible");
    tip(ev, new Date(near).toLocaleString("ko-KR", { hour12: false }) + "\n" + series.map((s) => { const p = s.points.find((p) => p[0] === near); return `${s.name}: ${p && p[1] != null ? yfmt(p[1]) : "–"}`; }).join("\n"));
  });
  g.addEventListener("mouseleave", () => { hair.setAttribute("visibility", "hidden"); tip(); });
  const legend = series.length > 1 ? el("div", { class: "legend" }, series.map((s, i) => el("span", {}, el("i", { style: `background:${s.color || SERIES[i % 8]}` }), s.name))) : null;
  return el("div", {}, legend, g);
}
const seriesOf = (rows, key, name, color, scale = 1) => ({ name, color, points: rows.map((r) => [r.bucket, r[key] == null ? null : r[key] * scale]) });
/** Top series by total; colour follows the name, not the rank. */
function splitSeries(rows, dim, key, top = 8, scale = 1) {
  const totals = {}; for (const r of rows) totals[r[dim]] = (totals[r[dim]] || 0) + (r[key] || 0);
  const names = Object.keys(totals).sort((a, b) => totals[b] - totals[a]).slice(0, top).sort();
  return names.map((name) => ({ name: fmt.text(name), points: rows.filter((r) => r[dim] === name).map((r) => [r.bucket, r[key] == null ? null : r[key] * scale]) }));
}
/** Histogram over the query engine's log bins, with percentile markers. */
function histogram(bins, bounds, marks, xfmt = fmt.ms) {
  const idx = bins.map((c, i) => c > 0 ? i : -1).filter((i) => i >= 0);
  if (!idx.length) return el("div", { class: "empty" }, "이 기간에 데이터가 없습니다");
  const lo = Math.max(0, idx[0] - 1), hi = Math.min(bins.length - 1, idx[idx.length - 1] + 1), n = hi - lo + 1;
  const W = 640, H = 220, m = { l: 56, r: 12, t: 44, b: 24 }, max = Math.max(...bins), total = bins.reduce((a, b) => a + b, 0);
  const bw = (W - m.l - m.r) / n, Y = (v) => H - m.b - (v / max) * (H - m.t - m.b);
  const X = (v) => m.l + (Math.log10(Math.max(v, bounds[lo])) - Math.log10(bounds[lo])) / (Math.log10(bounds[hi + 1]) - Math.log10(bounds[lo])) * (W - m.l - m.r);
  const g = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  for (let i = 0; i <= 3; i++) { const v = max * i / 3; g.append(svg("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--grid)" }), svg("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end" }, fmt.int(Math.round(v)))); }

        card("", "시간에 따른 분포 (히트맵)", "분위수 선으로는 안 보이는 두 봉우리나 갑자기 생긴 느린 무리를 찾을 때 봅니다.", heatmap(heat.rows, `hist:${m}`, heat.hist_bounds || [], w.span, hb)),
        card("c6", `${DIMS[L.dim]}별 분위수`, "p95가 큰 순서", table(byDim, [
          { key: L.dim, label: DIMS[L.dim] }, { key: "count", label: "요청", num: 1, fmt: fmt.int }, { key: `avg:${m}`, label: "평균", num: 1, fmt: fmt.ms }, { key: `p50:${m}`, label: "p50", num: 1, fmt: fmt.ms }, { key: `p90:${m}`, label: "p90", num: 1, fmt: fmt.ms },
          { key: `p95:${m}`, label: "p95", num: 1, fmt: fmt.ms, bar: 1 }, { key: `p99:${m}`, label: "p99", num: 1, fmt: fmt.ms }, { key: `max:${m}`, label: "최대", num: 1, fmt: fmt.ms }])),
        card("c6", "가장 느린 요청", "이 지표가 큰 순서 25건. 트레이스 ID로 대시보드의 트레이스 탭에서 구간별 시간을 볼 수 있습니다.", table(slow.filter((r) => r[m] != null), [
          { key: "ts", label: "시각", fmt: fmt.time }, { key: "agent_id", label: "에이전트" }, { key: "model", label: "모델" }, { key: m, label: LAT[m], num: 1, fmt: fmt.ms, bar: 1 },
          { key: "queue_ms", label: "대기", num: 1, fmt: fmt.ms }, { key: "status", label: "상태", num: 1, cls: (v) => v >= 400 || !v ? "neg" : "" }, { key: "output_tokens", label: "출력", num: 1, fmt: fmt.int }, { key: "trace_id", label: "트레이스", cls: () => "mono" }]))),
    ];
  } },

  // ------------------------------------------------------------------ explorer
  explore: { label: "시계열 탐색", async render() {
    const w = win(), X = state.ex, b = X.bucket || bucketFor(w.span);
    const metric = X.op === "count" ? "count" : `${X.op}:${X.col}`, yf = fmtFor(X.col, X.op);
    const filter = X.fcol && X.fval ? { [X.fcol]: [isNaN(X.fval) || X.fval === "" ? X.fval : +X.fval] } : {};
    const prevW = { from: w.from - w.span, to: w.from, span: w.span };
    const [series, totals, fvals, prev] = await Promise.all([
      q({ filter, bucket_ms: b, group_by: X.dim ? [X.dim] : [], metrics: [metric] }),
      q({ filter, group_by: X.dim ? [X.dim] : [], metrics: [...new Set([metric, "count"])], order_by: metric, limit: 100 }),
      X.fcol ? api(`/gateway/obs/values?col=${X.fcol}&from=${w.from}&to=${w.to}`) : [],
      X.compare && !X.dim ? q({ filter, bucket_ms: b, metrics: [metric] }, prevW) : null,
    ]);
    const lines = X.dim ? splitSeries(series, X.dim, metric) : [seriesOf(series, metric, "이번 기간")];
    if (prev) lines.push({ name: "직전 같은 길이 기간", color: "var(--muted)", dash: "5 4", points: prev.map((r) => [r.bucket + w.span, r[metric]]) });
    const set = (k) => (v) => { X[k] = k === "bucket" ? +v : v; refresh(); };
    const OPS = [["count", "건수"], ["sum", "합계"], ["avg", "평균"], ["p50", "p50"], ["p90", "p90"], ["p95", "p95"], ["p99", "p99"], ["max", "최대"], ["rate", "비율 (참인 요청)"], ["uniq", "고유 개수"]];
    const cols = X.op === "uniq" ? Object.entries(DIMS) : Object.entries(NUMS);
    if (X.op !== "count" && !cols.some(([k]) => k === X.col)) { X.col = cols[0][0]; return TABS.explore.render(); }
    return [
      el("div", { class: "row" },
        field("계산", selectOf(OPS, X.op, set("op"))),
        X.op === "count" ? null : field("대상", selectOf(cols, X.col, set("col"))),
        field("나눠 보기", selectOf([["", "나누지 않음"], ...Object.entries(DIMS).map(([k, v]) => [k, v + "별"])], X.dim, set("dim"))),
        field("시간 간격", selectOf([[0, "자동"], [1000, "1초"], [5000, "5초"], [10000, "10초"], [60000, "1분"], [300000, "5분"], [3600000, "1시간"]], X.bucket, set("bucket"))),
        field("조건", selectOf([["", "없음"], ...Object.entries(DIMS)], X.fcol, (v) => { X.fcol = v; X.fval = ""; refresh(); })),
        X.fcol ? field("값", selectOf([["", "선택"], ...fvals.map((v) => [v.value, `${v.value} (${fmt.int(v.count)})`])], X.fval, set("fval"))) : null,
        X.dim ? null : el("label", { style: "font-size:12px;color:var(--text2);padding-bottom:6px" }, el("input", { type: "checkbox", checked: X.compare, onchange: (e) => { X.compare = e.target.checked; refresh(); } }), " 직전 기간과 겹쳐 보기")),
      grid(
        card("", `${OPS.find((o) => o[0] === X.op)[1]}${X.op === "count" ? "" : " · " + (NUMS[X.col] || DIMS[X.col])}${X.dim ? " · " + DIMS[X.dim] + "별" : ""}`, `${fmt.dur(b)} 간격${X.dim ? ", 합이 큰 8개까지" : ""}`, lineChart(lines, { yfmt: yf, span: w.span, height: 280, wide: true })),
        card("", "기간 전체 값", X.dim ? `${DIMS[X.dim]}별, 큰 순서` : "", table(totals, [
          ...(X.dim ? [{ key: X.dim, label: DIMS[X.dim] }] : []), { key: metric, label: OPS.find((o) => o[0] === X.op)[1], num: 1, fmt: yf, bar: 1 }, ...(metric === "count" ? [] : [{ key: "count", label: "요청", num: 1, fmt: fmt.int }])]))),
    ];
  } },
};

// ---- shell
let seq = 0, busy = false;
async function refresh() {
  const mine = ++seq, tab = TABS[state.tab] || TABS.live;
  busy = true;
  try {
    const kids = await tab.render();
    if (mine !== seq) return;
    const y = scrollY; $("#view").replaceChildren(...kids.filter(Boolean)); scrollTo(0, y);
    showErr("");
  } catch (e) { if (mine === seq) showErr("데이터를 불러오지 못했습니다: " + e.message); }
  finally { if (mine === seq) busy = false; }
}
if (!TABS[state.tab]) state.tab = "live";
$("#tabs").append(...Object.entries(TABS).map(([k, t]) => el("button", { "data-tab": k, onclick: () => { state.tab = k; location.hash = k; mark(); refresh(); } }, t.label)));
function mark() { for (const b of $("#tabs").children) b.setAttribute("aria-selected", b.dataset.tab === state.tab); }
$("#range").addEventListener("change", refresh);
$("#reload").addEventListener("click", refresh);
// Leave the page alone while someone is typing, choosing or reading a dialog.
const editing = () => document.querySelector("dialog[open]") || ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName) && document.activeElement.type !== "checkbox";
let lastAuto = 0;
setInterval(() => {
  const every = TABS[state.tab]?.every || 15000;
  if (!$("#auto").checked || document.hidden || busy || editing() || Date.now() - lastAuto < every) return;
  lastAuto = Date.now(); refresh();
}, 500);
mark(); refresh();
</script>
</body>
