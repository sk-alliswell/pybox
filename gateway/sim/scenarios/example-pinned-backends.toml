# Not a measured replay. Two servers that can serve the same model, and a
# workload that is heavy for one of them: the situation the lab saw when one
# server sat idle for 175 s while the other still had a backlog.
name = "example-pinned-backends"
description = "Each team is pinned to its own model server. Team A sends more than its server can take while team B's server is mostly idle."
description_ko = "팀마다 모델 서버가 하나씩 고정되어 있습니다. A팀은 자기 서버가 감당할 수 없는 양을 보내고, B팀 서버는 대부분 놀고 있습니다."
max_s = 900

[[phase]]
name = "load"
from_s = 0
to_s = 120

[gateway]
[[gateway.upstream]]
name = "a"
models = ["small"]
targets = ["server-a"]
max_concurrency = 2

[[gateway.upstream]]
name = "b"
models = ["small-b"]
targets = ["server-b"]
max_concurrency = 2

[[model_server]]
name = "server-a"
models = ["small"]
slots = 1
tokens_per_s = 23
prefill_ms = 220

[[model_server]]
name = "server-b"
models = ["small-b"]
slots = 1
tokens_per_s = 33
prefill_ms = 135

[[client]]
name = "team-a"
class = "team-a"
entry = "gateway"
models = ["small"]
arrival = { kind = "poisson", rate_per_s = 1.0 }
to_s = 120
output_tokens = 40


[[client]]
name = "team-b"
class = "team-b"
entry = "gateway"
models = ["small-b"]
arrival = { kind = "poisson", rate_per_s = 0.15 }
to_s = 120
output_tokens = 40

