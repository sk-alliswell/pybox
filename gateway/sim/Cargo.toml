[package]
name = "gwsim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Discrete-event simulator for the pybox gateway stack: clients, gateway, LiteLLM, model servers, hosted APIs, MCP and the log store"
publish = false

# Standalone, like the gateway crate: its own lock file and dependency set.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true
