name = "3개 팀 400명, 하루"
seed = 11
max_s = 14700
description = "400 callers, 2 LiteLLM, 40 model replicas on 56 GPUs. Model and GPU speeds are assumed."
description_ko = "3개 팀의 호출자 400명, LiteLLM 2대, GPU 56장에 모델 복제본 40개입니다. 하루(14,400초로 줄임)에 집중 시간대가 한 번 있습니다. 모델과 GPU의 속도는 가정값이며 측정으로 검증하지 않았습니다."
[[proxy]]
name = "litellm"
count = 2
workers = 4
routing = "least_loaded"

[[model_server]]
name = "gpu-small"
count = 24
models = [ "small",]
slots = 8
tokens_per_s = 90
batch_scaling = 0.85
prefill_ms = 120
prefill_tokens_per_s = 2700
prompt_cache_saving = 0.93

[[model_server]]
name = "gpu-large"
count = 16
models = [ "large",]
slots = 8
tokens_per_s = 45
batch_scaling = 0.85
prefill_ms = 250
prefill_tokens_per_s = 1350
prompt_cache_saving = 0.93

