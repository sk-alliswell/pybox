# Saturation test (saturate.py): local models only. Everything is let in and held:
# interactive work goes first, batch waits for the slots that are left, a request
# that could not be answered inside its own deadline is told so at once, and if
# the queue ever fills up batch makes room.
listen = "127.0.0.1:8787"
admin_token = "lab-admin"

[obs]
backend = "memory"
memory_rows = 100000
otlp_token = "lab-otlp"

[[upstreams]]
name = "qwen"
base_url = "http://127.0.0.1:4000"
kind = "litellm"
api_key = "sk-lab-master"
max_concurrency = 2
max_queue = 1000
overflow = "evict"
admit_by_wait = true
strict_priority = true

[[upstreams]]
name = "smol"
base_url = "http://127.0.0.1:4000"
kind = "litellm"
api_key = "sk-lab-master"
max_concurrency = 2
max_queue = 1000
overflow = "evict"
admit_by_wait = true
strict_priority = true
