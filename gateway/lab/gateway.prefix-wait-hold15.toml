# Prefix-cache routing test (prefix_drive.py), local models only.
# One upstream, three llama.cpp servers behind it, each serving the same
# model with one request at a time and one cache slot (it keeps the KV state
# of the last prompt it read). Prefix routing with session admission:
# a prompt no server holds does not push out one used in the last 15 s (it
# waits, at most 20 s).
listen = "127.0.0.1:8787"
admin_token = "lab-admin"

[obs]
backend = "memory"
memory_rows = 100000

[[upstreams]]
name = "local"
base_url = "http://127.0.0.1:9211"
kind = "none"
max_queue = 2000
affinity = "prefix"
affinity_wait_ms = 3000
slot_hold_ms = 15000
slot_max_wait_ms = 20000

[[upstreams.backends]]
name = "s1"
base_url = "http://127.0.0.1:9211"
max_concurrency = 1

[[upstreams.backends]]
name = "s2"
base_url = "http://127.0.0.1:9212"
max_concurrency = 1

[[upstreams.backends]]
name = "s3"
base_url = "http://127.0.0.1:9213"
max_concurrency = 1

[[agents]]
id = "lab"
token = "lab-agent"
