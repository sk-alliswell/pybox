# Day-to-day operation checks (lab/ops_check.py): three local model servers
# behind one upstream, health probes, the TDB store, reports.
# __PROBE__ and __DIR__ are filled in by the script.
listen = "127.0.0.1:8787"
admin_token = "lab-admin"

[retry]
max_retries = 2
base_ms = 200
max_ms = 1000

[[upstreams]]
name = "local"
base_url = "http://127.0.0.1:9211"
kind = "none"
max_concurrency = 3
policy = "fair"
affinity = "off"
queue_timeout_secs = 20
health_probe_secs = __PROBE__
refuse_when_down = true
[[upstreams.backends]]
name = "s1"
base_url = "http://127.0.0.1:9211"
max_concurrency = 1
[[upstreams.backends]]
name = "s2"
base_url = "http://127.0.0.1:9212"
max_concurrency = 1
[[upstreams.backends]]
name = "s3"
base_url = "http://127.0.0.1:9213"
max_concurrency = 1

[[agents]]
id = "ide"
token = "lab-ide-token"
team_id = "platform"
user_id = "ann"
priority = "interactive"
kind = "ide"

[[agents]]
id = "chat"
token = "lab-chat-token"
team_id = "support"
user_id = "bob"
kind = "chat"

[obs]
enabled = true
backend = "tdb"
dir = "__DIR__/obs"

[reports]
dir = "__DIR__/reports"
at = "07:00"
tz_hours = 9
