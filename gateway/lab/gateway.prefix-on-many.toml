# Prefix-cache routing test (prefix_drive.py), local models only.
# One upstream, three llama.cpp servers behind it, each serving the same
# model with one request at a time, started with `--cache true` so that it
# keeps the KV state of many prompts (prefix_slots = 64). A request goes to the free server
# that holds the longest start of its prompt.
listen = "127.0.0.1:8787"
admin_token = "lab-admin"

[obs]
backend = "memory"
memory_rows = 100000

[[upstreams]]
name = "local"
base_url = "http://127.0.0.1:9211"
kind = "none"
max_queue = 2000
affinity = "prefix"

[[upstreams.backends]]
name = "s1"
base_url = "http://127.0.0.1:9211"
max_concurrency = 1
prefix_slots = 64

[[upstreams.backends]]
name = "s2"
base_url = "http://127.0.0.1:9212"
max_concurrency = 1
prefix_slots = 64

[[upstreams.backends]]
name = "s3"
base_url = "http://127.0.0.1:9213"
max_concurrency = 1
prefix_slots = 64

[[agents]]
id = "lab"
token = "lab-agent"
