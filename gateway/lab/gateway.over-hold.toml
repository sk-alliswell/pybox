# Overload test (overload_drive.py), local models only: one upstream, three
# llama.cpp servers, one request at a time each. Staged refusal from a quarter of the queue (30), batch keeps a tenth of the places.
# Plus hold_batch: batch requests are held beside the queue (up to 300 s) and
# sent when nothing else waits, instead of being refused.
# Plus admit_by_wait: a request whose expected wait is longer than it can wait
# (30 s here, or its own x-gateway-max-wait-ms) is refused at the door.
listen = "127.0.0.1:8787"
admin_token = "lab-agent-admin"

[obs]
backend = "memory"
memory_rows = 100000

[[upstreams]]
name = "local"
base_url = "http://127.0.0.1:9211"
kind = "none"
affinity = "off"
max_queue = 30
shed_from = 0.25
shed_ceiling = 0.75
shed_floor = 0.1
admit_by_wait = true
queue_timeout_secs = 30
hold_batch = true
hold_timeout_secs = 300

[[upstreams.backends]]
name = "s1"
base_url = "http://127.0.0.1:9211"
max_concurrency = 1

[[upstreams.backends]]
name = "s2"
base_url = "http://127.0.0.1:9212"
max_concurrency = 1

[[upstreams.backends]]
name = "s3"
base_url = "http://127.0.0.1:9213"
max_concurrency = 1

[[agents]]
id = "ide"
token = "lab-agent-ide"
weight = 4
priority = "interactive"

[[agents]]
id = "chat"
token = "lab-agent-chat"
weight = 2

[[agents]]
id = "batch"
token = "lab-agent-batch"
weight = 1
priority = "batch"
