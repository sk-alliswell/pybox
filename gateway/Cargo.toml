[package]
name = "pybox-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Host-side LLM gateway for many local pybox agents: pooling, rate limits, fair queuing, SSE streaming"
publish = false

# Standalone: keeps the pybox controller's dependency set and Cargo.lock untouched.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
futures-util = "0.3"
http = "1"
memchr = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[profile.release]
lto = "thin"
codegen-units = 1

